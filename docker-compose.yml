services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mltutor
      POSTGRES_USER: mltutor
      POSTGRES_PASSWORD: mltutor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mltutor -d mltutor"]
      interval: 5s
      timeout: 3s
      retries: 10
  ml-execution:
    build: {context: ., dockerfile: services/ml_execution/Dockerfile}
    environment: {INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?set-internal-service-key}, ML_MAX_CONCURRENCY: 2, ML_EXECUTION_TIMEOUT_SECONDS: 60}
  affect-inference:
    build: {context: ., dockerfile: services/affect_inference/Dockerfile}
    environment: {INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?set-internal-service-key}, AFFECT_MAX_CONCURRENCY: 1, AFFECT_INFERENCE_TIMEOUT_SECONDS: 15, AFFECT_MAX_IMAGE_BYTES: 5242880}
  core-api:
    build: {context: ., dockerfile: backend/Dockerfile}
    depends_on: {postgres: {condition: service_healthy}, ml-execution: {condition: service_started}, affect-inference: {condition: service_started}}
    ports: ["8000:8080"]
    environment:
      DATABASE_URL: postgresql+psycopg2://mltutor:mltutor@postgres:5432/mltutor
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      RESEARCHER_API_KEY: ${RESEARCHER_API_KEY:?set-researcher-api-key}
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?set-internal-service-key}
      ML_EXECUTION_SERVICE_URL: http://ml-execution:8080
      AFFECT_INFERENCE_SERVICE_URL: http://affect-inference:8080
    command: sh -c "alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080"
